[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "cython>=3.0", "numpy>=2"]
build-backend = "setuptools.build_meta"

[project]
name = "cyvlfeat"
dynamic = ["version"]
description = "Cython wrapper of the VLFeat toolkit"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE.txt", "VLFEAT-LICENSE"]
authors = [{ name = "Patrick Snape", email = "patricksnape@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]
classifiers = ["Programming Language :: Cython", "Programming Language :: C"]

[project.urls]
Homepage = "https://github.com/menpo/cyvlfeat"

[dependency-groups]
dev = ["pytest>=8", "scipy>=1.10", "pooch"]

[tool.setuptools.packages.find]
include = ["cyvlfeat*"]

[tool.setuptools.package-data]
cyvlfeat = ["data/*.mat", "data/ascent.descr", "data/ascent.frame", "*.pxd", "*/*.pxd", "_vl/*.pxd"]

[tool.setuptools.exclude-package-data]
"*" = ["*.c", "*.pyx"]

[tool.setuptools_scm]
version_file = "cyvlfeat/_version.py"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["cyvlfeat"]

[tool.cibuildwheel]
# One wheel per CPython 3.10-3.14 (the extensions are not abi3 and not free-threading aware, so no
# cp3xxt builds). VLFeat is compiled into the wheel, so there is nothing to repair/bundle.
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
skip = ["*-win32", "*_i686", "*t-*"]
test-requires = ["pytest", "scipy>=1.10", "pooch"]
# run from outside the checkout so the installed wheel is what gets imported
test-command = "pytest --pyargs cyvlfeat -q -p no:cacheprovider"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.linux]
# ccache speeds up rebuilds of unchanged sources. The cache directory is /ccache inside the build
# container; release.yml bind-mounts a directory restored from the GitHub Actions cache there
# (without the mount it is just an empty directory, so local runs work too).
before-all = "if command -v apk >/dev/null; then apk add --no-cache ccache; else dnf install -y epel-release && dnf install -y ccache; fi"
environment = "CC='ccache gcc' CCACHE_DIR=/ccache CCACHE_MAXSIZE=500M CCACHE_COMPILERCHECK=content"
before-build = "ccache --zero-stats"
before-test = "ccache --show-stats"
