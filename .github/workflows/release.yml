name: Release

# Builds wheels + sdist on every PR, on manual runs and on version tags. Publishing uses PyPI
# trusted publishing (OIDC, no tokens) and uploads PEP 740 attestations automatically.
#   * push a tag `vX.Y.Z`                 -> PyPI (+ GitHub release; aN/bN/rcN/.devN are pre-releases)
#   * manual run with `publish: testpypi` -> TestPyPI
#   * pushes to master only build (and warm the ccache that pull requests restore)
# Tag builds never use ccache: release artifacts are built from a clean state.
on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Where to publish the built files"
        type: choice
        options: [none, testpypi]
        default: none

permissions:
  contents: read

jobs:
  wheels:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # linux x86_64 (manylinux + musllinux)
          - ubuntu-24.04-arm   # linux aarch64
          - windows-latest     # win amd64
          - macos-15-intel     # macOS x86_64
          - macos-latest       # macOS arm64
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 0 }   # setuptools-scm needs tags
      # ccache (Linux + macOS, never on tags or Windows). The cache lives on the host outside the
      # workspace (cibuildwheel copies the workspace into its containers). It is saved on every run
      # (also failed ones); runs restore the newest cache of their own ref or of master.
      - name: ccache - choose the cache directory
        if: runner.os != 'Windows' && !startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p "$RUNNER_TEMP/ccache"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
      - name: ccache (Linux) - install in the build containers and mount the cache directory
        if: runner.os == 'Linux' && !startsWith(github.ref, 'refs/tags/')
        run: |
          {
            echo "CIBW_CONTAINER_ENGINE=docker; create_args: --volume=$CCACHE_DIR:/ccache"
            echo "CIBW_BEFORE_ALL_LINUX=if command -v apk >/dev/null; then apk add --no-cache ccache; else dnf install -y epel-release && dnf install -y ccache; fi"
            echo "CIBW_ENVIRONMENT_LINUX=CC='ccache gcc' CCACHE_DIR=/ccache CCACHE_MAXSIZE=500M CCACHE_COMPILERCHECK=content"
            echo "CIBW_BEFORE_BUILD_LINUX=ccache --zero-stats"
            echo "CIBW_BEFORE_TEST_LINUX=ccache --show-stats"
          } >> "$GITHUB_ENV"
      - name: ccache (macOS) - install and use as the compiler wrapper
        if: runner.os == 'macOS' && !startsWith(github.ref, 'refs/tags/')
        run: |
          brew install ccache
          {
            echo "CC=ccache clang"
            echo "CCACHE_COMPILERCHECK=content"
            echo "CCACHE_MAXSIZE=500M"
          } >> "$GITHUB_ENV"
      - name: Restore ccache
        if: runner.os != 'Windows' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.os }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.os }}-
      - uses: pypa/cibuildwheel@v4.3.5
        # build selection, tests and per-platform settings are configured in pyproject.toml
      - name: ccache statistics (macOS)
        if: runner.os == 'macOS' && !startsWith(github.ref, 'refs/tags/')
        run: ccache --show-stats
      - name: Save ccache
        if: always() && runner.os != 'Windows' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.os }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
      - run: uv build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  check:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: ls -l dist
      - run: pipx run twine check --strict dist/*

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # trusted publishing
      contents: write        # GitHub release
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Tag must match the built version
        run: |
          test -f "dist/cyvlfeat-${GITHUB_REF_NAME#v}.tar.gz" \
            || { echo "tag ${GITHUB_REF_NAME} does not match built files:"; ls dist; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # PEP 440 pre-releases (a/b/rc/dev) must not become the "latest" GitHub release
          flags=()
          if [[ "$GITHUB_REF_NAME" =~ ([0-9](a|b|rc)[0-9]+|\.dev[0-9]+)$ ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME" "${flags[@]}"

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'testpypi'
    needs: check
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
